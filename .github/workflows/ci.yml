name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements-docker.txt

      - name: Validate Python
        run: python -m py_compile server.py config.py ptz.py

      - name: Validate shell scripts
        run: bash -n start.sh start-mediamtx.sh docker-entrypoint.sh

      - name: Validate Compose
        run: |
          cp .env.exemplo .env
          docker compose config --quiet
          docker compose -f compose.pi.yaml config --quiet

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag camera-monitor:ci .

  # Push na main com o CI verde: manda os arquivos do app para o Raspberry Pi
  # pelo Cloudflare Tunnel. A chave so executa deploy-pi.sh la (comando forcado).
  deploy-pi:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-pi
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      # Sem isto, token recusado vira o cloudflared esperando login no navegador.
      - name: Check Cloudflare Access service token
        env:
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          [ -n "$PI_SSH_HOST" ] || { echo "::error::secret PI_SSH_HOST vazio"; exit 1; }
          [ -n "$CF_ID" ] && [ -n "$CF_SECRET" ] || { echo "::error::secrets CF_ACCESS_CLIENT_ID/CF_ACCESS_CLIENT_SECRET vazios"; exit 1; }
          case "$CF_ID" in *.access) ;; *) echo "::error::CF_ACCESS_CLIENT_ID deve terminar em .access";; esac
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' -H "CF-Access-Client-Id: $CF_ID" \
                -H "CF-Access-Client-Secret: $CF_SECRET" "https://$PI_SSH_HOST/")
          case "$loc" in *cloudflareaccess.com*)
            echo "::error::Access recusou o service token: confira se a aplicacao do $PI_SSH_HOST tem policy com Action=Service Auth incluindo este token"
            exit 1;; esac
          echo "service token aceito"

      - name: Deploy
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_KNOWN_HOSTS: ${{ secrets.PI_KNOWN_HOSTS }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          install -m700 -d ~/.ssh
          printf '%s\n' "$PI_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s %s\n' "$PI_SSH_HOST" "$PI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf - Dockerfile.pi compose.pi.yaml server.py config.py ptz.py gunicorn.conf.py \
              docker-entrypoint.sh MobileNetSSD_deploy.prototxt MobileNetSSD_deploy.caffemodel \
            | timeout 600 ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 \
                -o ProxyCommand="cloudflared access ssh --hostname %h" "pi@$PI_SSH_HOST"
