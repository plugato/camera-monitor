name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements-docker.txt

      - name: Validate Python
        run: python -m py_compile server.py config.py ptz.py

      - name: Validate shell scripts
        run: bash -n start.sh start-mediamtx.sh docker-entrypoint.sh

      - name: Validate Compose
        run: docker compose config --quiet

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag camera-monitor:ci .
