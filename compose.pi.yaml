# Raspberry Pi na mesma rede da camera. Standalone (nao e overlay):
#   docker compose -f compose.pi.yaml up -d --build
#
# - Pi 3 nao decodifica o H265 1080p em tempo real: use CAM_PATH=onvif2
#   (substream 640x360) no .env.
# - DETECT_*: aqui e nao no .env (sobrepoem o de la). Com chuva o filtro de
#   movimento deixa o MobileNet rodar sem parar; com 2 threads ele tomava a CPU
#   do FFmpeg e o video congelava. Com 1 thread tudo roda na thread de deteccao,
#   que fica em nice 10: sem CPU sobrando, atrasa a deteccao, nao o video.
# - A porta 8090 do host ja esta em uso no Pi, por isso 8091.
# - Sem container cloudflared: o Pi ja roda o cloudflared como servico. Publique
#   um hostname apontando para http://localhost:8091 no painel do tunnel.
services:
  camera-monitor:
    build:
      context: .
      dockerfile: Dockerfile.pi
    restart: unless-stopped
    env_file: .env
    environment:
      MEDIAMTX_URL: rtsp://127.0.0.1:8554/camera
      DETECT_THREADS: "1"
      DETECT_INTERVAL_S: "0"   # sem pausa: o nice 10 já protege o vídeo
      VIDEO_FPS: "4"           # metade do custo de conversão, JPEG e envio
      TZ: America/Sao_Paulo    # hora das notificações, das fotos e dos pushes
    ports:
      - "8091:8090"   # rede local também: sem o JWT do Access vale APP_USER/APP_PASS
    volumes:
      - ./fotos:/app/fotos
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 6
